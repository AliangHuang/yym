[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yym"
version = "0.1.3"
description = "Read-only Onmyoji daily and weekly companion for MuMu on Windows"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["PySide6-Essentials==6.12.0", "pyelftools==0.33"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.gui-scripts]
yym = "yym.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yym = ["profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
